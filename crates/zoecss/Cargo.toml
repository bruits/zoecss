[package]
name = "zoecss"
version = "0.0.1"
description = "CLI for ZoeCSS — scan, extract, cache, and output CSS"
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "zoecss"
path = "src/main.rs"

[dependencies]
zoecss-core = { path = "../zoecss-core" }
zoecss-config = { path = "../zoecss-config" }
zoecss-preset-tailwindcss4 = { path = "../zoecss-presets-tailwindcss4" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
codspeed-criterion-compat = "2"

[[bench]]
name = "pipeline"
harness = false
